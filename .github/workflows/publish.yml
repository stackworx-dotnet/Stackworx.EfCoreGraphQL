# Publishes the Stackworx.EfCoreGraphQL packages to nuget.org using Trusted
# Publishing (OIDC). No long-lived NuGet API key is stored — NuGet/login
# exchanges a short-lived GitHub OIDC token for a temporary API key. See
# README/docs for the one-time nuget.org policy setup.
#
# Unlike Stackworx.Analyzers (a single package), this repo ships several
# packages, each with its own version managed in its .csproj. We pack the whole
# solution and push every produced .nupkg with --skip-duplicate, so only
# packages whose version was bumped are actually published.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # required for the GitHub OIDC token exchange
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Stackworx.EfCoreGraphQL.slnx

      - name: Pack
        run: >
          dotnet pack Stackworx.EfCoreGraphQL.slnx
          --configuration Release
          --no-restore
          --output ${{ github.workspace }}/artifacts

      # Request a short-lived NuGet API key via OIDC. Set the NUGET_USER repo
      # variable to your nuget.org username (profile name, NOT your email).
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
